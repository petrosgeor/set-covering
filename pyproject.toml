[project]
name = "set-covering"
version = "0.1.0"
description = "Reinforcement learning experiments for the set covering problem."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cvxpy",
    "gymnasium",
    "highspy",
    "jaxtyping",
    "matplotlib",
    "numpy",
    "pyyaml",
    "torch",
    "torchrl",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
